<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Medical Coding Result
</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
    135deg,
    #0f172a,
    #1e3a8a,
    #06b6d4
    );
    padding:30px;
}

.container{
    width:900px;
    max-width:100%;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    color:white;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

.title{
    text-align:center;
    font-size:36px;
    margin-bottom:30px;
}

.success{
    text-align:center;
    font-size:22px;
    margin-bottom:30px;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.15);
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.card h3{
    margin-bottom:10px;
    color:#e0f2fe;
}

.card p{
    font-size:20px;
    font-weight:600;
}

.icd{
    color:#22c55e;
}

.cpt{
    color:#facc15;
}

.buttons{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:50px;
    color:white;
    font-weight:600;
    transition:0.3s;
}

.pdf-btn{
    background:#22c55e;
}

.dashboard-btn{
    background:#2563eb;
}

.home-btn{
    background:#9333ea;
}

.btn:hover{
    transform:translateY(-3px);
}

.footer{
    text-align:center;
    margin-top:30px;
    opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
🏥 Medical Coding AI
</h1>

<div class="success">
✅ Medical Codes Generated Successfully
</div>

<div class="card-grid">

<div class="card">
<h3>Patient Name</h3>
<p>{{ patient }}</p>
</div>

<div class="card">
<h3>Diagnosis</h3>
<p>{{ diagnosis }}</p>
</div>

<div class="card">
<h3>Procedure</h3>
<p>{{ procedure }}</p>
</div>

<div class="card">
<h3>ICD Code</h3>
<p class="icd">{{ icd }}</p>
</div>

<div class="card">
<h3>CPT Code</h3>
<p class="cpt">{{ cpt }}</p>
</div>

</div>

<div class="buttons">

<a href="/download_pdf" class="btn pdf-btn">
📄 Download PDF Report
</a>

<a href="/dashboard" class="btn dashboard-btn">
📊 Open Dashboard
</a>

<a href="/" class="btn home-btn">
🏠 New Patient
</a>

</div>

<div class="footer">
Generated by Medical Coding AI System
</div>

</div>

</body>

</html>
